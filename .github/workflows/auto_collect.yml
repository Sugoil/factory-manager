name: Hourly Small Naver Real Estate Collect

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-small-naver-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect at most three new listings
        run: python auto_collect.py
      - name: Commit collection results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.db listings.csv collect_logs.csv search_conditions.json
          if git diff --cached --quiet; then
            echo "No collection changes"
          else
            git commit -m "chore: hourly small listing collection"
            git push
          fi
